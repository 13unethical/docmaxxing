{% extends "base.html" %}
{% block title %}{{ page_title }} — DocMaxxing{% endblock %}
{% block page_header %}
<header class="top info-hero">
  <h1>{{ page_title }}</h1>
  {% if page_lede %}
  <p class="lede">{{ page_lede }}</p>
  {% endif %}
</header>
{% endblock %}
{% block content %}
<section class="info-page">
  {% include "info/_toc.html" %}
  <article class="info-article">
    {% block info_body %}{% endblock %}
  </article>
</section>
{% endblock %}
