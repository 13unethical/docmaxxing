{% extends "base.html" %}
{% block title %}Sign in — DocMaxxing{% endblock %}
{% block content %}
      <section class="auth-wrap">
        <div class="card auth-card">
          <h1 class="auth-title">Welcome back</h1>
          <p class="auth-sub">Sign in to your DocMaxxing account.</p>

          {% if error %}
          <p class="auth-error" role="alert">{{ error }}</p>
          {% endif %}

          <form method="post" action="{{ url_for('login') }}{% if next_url %}?next={{ next_url }}{% endif %}" class="auth-form">
            <label class="auth-field">
              <span class="auth-label">Email</span>
              <input type="email" name="email" required autocomplete="email"
                     value="{{ (form.email if form else '') or '' }}" placeholder="you@university.edu" />
            </label>
            <label class="auth-field">
              <span class="auth-label">Password</span>
              <input type="password" name="password" required autocomplete="current-password" placeholder="Your password" />
            </label>
            <button type="submit" class="cta auth-submit">Sign in</button>
          </form>

          <p class="auth-alt">No account yet? <a href="{{ url_for('register') }}">Create one</a></p>
        </div>
      </section>
{% endblock %}
