name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0

        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          command_timeout: 10m

          script: |
            set -euo pipefail
            cd /root/docmaxxing
            git fetch origin main
            git reset --hard origin/main
            mkdir -p /root/docmaxxing/data/projects
            mkdir -p /root/docmaxxing/data/project_engine
            mkdir -p /root/docmaxxing/data/tmp/format_v2_documents
            chmod 700 /root/docmaxxing/data/tmp/format_v2_documents
            touch /root/docmaxxing/data/assignment-trace.log
            if ! grep -q '^PROJECT_STORAGE_DIR=' .env 2>/dev/null; then
              echo 'PROJECT_STORAGE_DIR=/root/docmaxxing/data/projects' >> .env
            fi
            if ! grep -q '^PROJECT_ENGINE_DIR=' .env 2>/dev/null; then
              echo 'PROJECT_ENGINE_DIR=/root/docmaxxing/data/project_engine' >> .env
            fi
            if grep -q '^FORMATTER_V2_ENABLED=' .env 2>/dev/null; then
              sed -i 's/^FORMATTER_V2_ENABLED=.*/FORMATTER_V2_ENABLED=1/' .env
            else
              echo 'FORMATTER_V2_ENABLED=1' >> .env
            fi
            source venv/bin/activate
            pip install -r requirements.txt
            install -m 644 deploy/docmaxxing.service /etc/systemd/system/docmaxxing.service
            bash scripts/install_backup_timers.sh
            systemctl daemon-reload
            systemctl enable docmaxxing
            systemctl restart docmaxxing
            systemctl is-active --quiet docmaxxing
            bash scripts/patch_nginx_timeouts.sh || true
            echo "Deployed $(git rev-parse --short HEAD)"
            echo "Storage: $(grep PROJECT_STORAGE_DIR .env || true)"
            if grep -qE '^TURNITIN_API_KEY=.+' .env && grep -qE '^TURNITIN_API_SECRET=.+' .env; then
              echo "PlagDetect API credentials: present"
            else
              echo "WARNING: TURNITIN_API_KEY/SECRET missing — Turnitin stays on browser automation"
            fi
            if grep -qE '^TURNITIN_USE_TCA=1' .env; then
              echo "WARNING: TURNITIN_USE_TCA=1 — official TCA path, not PlagDetect HTTP"
            fi
            if grep -qE '^TURNITIN_USE_BROWSER=1' .env; then
              echo "WARNING: TURNITIN_USE_BROWSER=1 — forcing Chrome fallback"
            fi
            ls -la /root/docmaxxing/data/assignment-trace.log || true
