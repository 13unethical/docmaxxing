name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0

        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          command_timeout: 10m

          script: |
            set -euo pipefail
            cd /root/docmaxxing
            git fetch origin main
            git reset --hard origin/main
            mkdir -p /root/docmaxxing/data/projects
            mkdir -p /root/docmaxxing/data/project_engine
            mkdir -p /root/docmaxxing/data/tmp/format_v2_documents
            chmod 700 /root/docmaxxing/data/tmp/format_v2_documents
            touch /root/docmaxxing/data/assignment-trace.log
            if ! grep -q '^PROJECT_STORAGE_DIR=' .env 2>/dev/null; then
              echo 'PROJECT_STORAGE_DIR=/root/docmaxxing/data/projects' >> .env
            fi
            if ! grep -q '^PROJECT_ENGINE_DIR=' .env 2>/dev/null; then
              echo 'PROJECT_ENGINE_DIR=/root/docmaxxing/data/project_engine' >> .env
            fi
            if grep -q '^FORMATTER_V2_ENABLED=' .env 2>/dev/null; then
              sed -i 's/^FORMATTER_V2_ENABLED=.*/FORMATTER_V2_ENABLED=1/' .env
            else
              echo 'FORMATTER_V2_ENABLED=1' >> .env
            fi
            if grep -q '^APP_ENV=' .env 2>/dev/null; then
              sed -i 's/^APP_ENV=.*/APP_ENV=production/' .env
            else
              echo 'APP_ENV=production' >> .env
            fi
            # Humanizer: CHUNK_WORDS=1 made every paragraph its own request; short ones often stayed verbatim.
            if grep -q '^HUMANIZER_STUDENT_CHUNK_WORDS=' .env 2>/dev/null; then
              sed -i 's/^HUMANIZER_STUDENT_CHUNK_WORDS=.*/HUMANIZER_STUDENT_CHUNK_WORDS=600/' .env
            else
              echo 'HUMANIZER_STUDENT_CHUNK_WORDS=600' >> .env
            fi
            # document (strict): first-pass pool, aggressive sentence flag cut, multi-round refine.
            if grep -q '^HUMANIZER_STUDENT_PICK=' .env 2>/dev/null; then
              sed -i 's/^HUMANIZER_STUDENT_PICK=.*/HUMANIZER_STUDENT_PICK=document/' .env
            else
              echo 'HUMANIZER_STUDENT_PICK=document' >> .env
            fi
            if grep -q '^HUMANIZER_STUDENT_SAMPLING=' .env 2>/dev/null; then
              sed -i 's/^HUMANIZER_STUDENT_SAMPLING=.*/HUMANIZER_STUDENT_SAMPLING=1.2:4/' .env
            else
              echo 'HUMANIZER_STUDENT_SAMPLING=1.2:4' >> .env
            fi
            if grep -q '^HUMANIZER_STUDENT_REFINE_SAMPLING=' .env 2>/dev/null; then
              sed -i 's/^HUMANIZER_STUDENT_REFINE_SAMPLING=.*/HUMANIZER_STUDENT_REFINE_SAMPLING=1.2:16/' .env
            else
              echo 'HUMANIZER_STUDENT_REFINE_SAMPLING=1.2:16' >> .env
            fi
            if grep -q '^HUMANIZER_STUDENT_CONCLUSION_SAMPLING=' .env 2>/dev/null; then
              sed -i 's/^HUMANIZER_STUDENT_CONCLUSION_SAMPLING=.*/HUMANIZER_STUDENT_CONCLUSION_SAMPLING=1.3:12/' .env
            else
              echo 'HUMANIZER_STUDENT_CONCLUSION_SAMPLING=1.3:12' >> .env
            fi
            if grep -q '^HUMANIZER_STUDENT_REFINE_ABOVE=' .env 2>/dev/null; then
              sed -i 's/^HUMANIZER_STUDENT_REFINE_ABOVE=.*/HUMANIZER_STUDENT_REFINE_ABOVE=0.22/' .env
            else
              echo 'HUMANIZER_STUDENT_REFINE_ABOVE=0.22' >> .env
            fi
            if grep -q '^HUMANIZER_STUDENT_DOC_FLAG_ABOVE=' .env 2>/dev/null; then
              sed -i 's/^HUMANIZER_STUDENT_DOC_FLAG_ABOVE=.*/HUMANIZER_STUDENT_DOC_FLAG_ABOVE=0.22/' .env
            else
              echo 'HUMANIZER_STUDENT_DOC_FLAG_ABOVE=0.22' >> .env
            fi
            if grep -q '^HUMANIZER_STUDENT_DOC_ROUNDS=' .env 2>/dev/null; then
              sed -i 's/^HUMANIZER_STUDENT_DOC_ROUNDS=.*/HUMANIZER_STUDENT_DOC_ROUNDS=5/' .env
            else
              echo 'HUMANIZER_STUDENT_DOC_ROUNDS=5' >> .env
            fi
            if grep -q '^HUMANIZER_STUDENT_DOC_BUDGET=' .env 2>/dev/null; then
              sed -i 's/^HUMANIZER_STUDENT_DOC_BUDGET=.*/HUMANIZER_STUDENT_DOC_BUDGET=90/' .env
            else
              echo 'HUMANIZER_STUDENT_DOC_BUDGET=90' >> .env
            fi
            if grep -q '^HUMANIZER_STUDENT_EARLY_STOP=' .env 2>/dev/null; then
              sed -i 's/^HUMANIZER_STUDENT_EARLY_STOP=.*/HUMANIZER_STUDENT_EARLY_STOP=0.15/' .env
            else
              echo 'HUMANIZER_STUDENT_EARLY_STOP=0.15' >> .env
            fi
            # Cite pilot pages require these files next to the /cite route.
            test -f services/cite_guides.py
            test -f templates/landing/cite_guide.html
            test -f seo/keyword-map.csv
            source venv/bin/activate
            pip install -r requirements.txt
            install -m 644 deploy/docmaxxing.service /etc/systemd/system/docmaxxing.service
            install -m 644 deploy/docmaxxing-tt-detector-labels.service /etc/systemd/system/docmaxxing-tt-detector-labels.service
            install -m 644 deploy/docmaxxing-tt-detector-labels.timer /etc/systemd/system/docmaxxing-tt-detector-labels.timer
            bash scripts/install_backup_timers.sh
            bash scripts/install_humanizer_training_timer.sh
            systemctl daemon-reload
            systemctl enable docmaxxing
            systemctl enable --now docmaxxing-tt-detector-labels.timer
            systemctl restart docmaxxing
            systemctl is-active --quiet docmaxxing
            systemctl is-enabled --quiet docmaxxing-humanizer-training-daily.timer
            systemctl is-enabled --quiet docmaxxing-humanizer-training-export.timer
            systemctl is-enabled --quiet docmaxxing-tt-detector-labels.timer
            bash scripts/patch_nginx_timeouts.sh || true
            # Peak-hours Modal keep-warm (Tashkent 09–01). Idempotent crontab line.
            chmod +x scripts/keep_humanizer_warm_peak.sh || true
            {
              crontab -l 2>/dev/null | grep -v 'keep_humanizer_warm_peak.sh' || true
              echo '*/1 * * * * /root/docmaxxing/scripts/keep_humanizer_warm_peak.sh'
            } | crontab - || true
            echo "Deployed $(git rev-parse --short HEAD)"
            echo "Storage: $(grep PROJECT_STORAGE_DIR .env || true)"
            if grep -qE '^TURNITIN_API_KEY=.+' .env && grep -qE '^TURNITIN_API_SECRET=.+' .env; then
              echo "PlagDetect API credentials: present"
            else
              echo "WARNING: TURNITIN_API_KEY/SECRET missing — Turnitin stays on browser automation"
            fi
            if grep -qE '^TURNITIN_USE_TCA=1' .env; then
              echo "WARNING: TURNITIN_USE_TCA=1 — official TCA path, not PlagDetect HTTP"
            fi
            if grep -qE '^TURNITIN_USE_BROWSER=1' .env; then
              echo "WARNING: TURNITIN_USE_BROWSER=1 — forcing Chrome fallback"
            fi
            ls -la /root/docmaxxing/data/assignment-trace.log || true
            echo "=== Recent Format V2 / cite failures ==="
            journalctl -u docmaxxing --since "14 days ago" --no-pager 2>/dev/null \
              | grep -E "Format V2 failed|cite_guides|Traceback|/cite/|/api/format-v2" \
              | tail -120 || true
            journalctl -u docmaxxing --since "14 days ago" --no-pager -o short-iso 2>/dev/null \
              | grep -A25 "Format V2 failed" \
              | tail -200 || true
            echo "=== Cite smoke ==="
            cite_code=$(curl -sS -o /tmp/cite_smoke.html -w "%{http_code}" --max-time 30 \
              "https://docmaxxing.com/cite/apa7-website" || echo "000")
            echo "GET /cite/apa7-website -> ${cite_code}"
            test "${cite_code}" = "200"
            # Post-deploy SEO smoke (Googlebot UA): locales, canonical, hreflang, robots.
            python scripts/prod_seo_smoke.py --base https://docmaxxing.com
